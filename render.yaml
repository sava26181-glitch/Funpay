services:
  - type: web
    name: donutpay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_RELAY_URL
        sync: false
      - key: MAIL_RELAY_SECRET
        sync: false
      - key: TURNSTILE_SITEKEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: CF_PROXY
        sync: false
      - key: TG_CHANNEL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_TG
        sync: false
      - key: OPERATOR_NAME
        sync: false
      - key: OPERATOR_INFO
        sync: false
