<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DonutPay</title>
<style>
:root{--bg:#08080C;--c:#111116;--c2:#19151F;--p:#8B5CF6;--pl:#C4B5FD;--m:#A1A1AA;--b:#24242c;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:#fff;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none;cursor:pointer}button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:1100px;margin:0 auto;padding:0 16px}h1,h2,h3{margin:0;line-height:1.2}h2{font-size:18px;margin:22px 0 10px}h3{font-size:15px;margin:16px 0 6px}
header{position:sticky;top:env(safe-area-inset-top);background:rgba(8,8,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--b);z-index:5}
.hd{display:flex;align-items:center;gap:10px;padding:8px 0;flex-wrap:wrap}.logo{display:flex;gap:8px;align-items:center;font-weight:800;font-size:18px}.sp{flex:1}.hs{order:3;flex:1 0 100%}
input,select,textarea{width:100%;background:#0c0c10;border:1px solid var(--b);border-radius:10px;padding:10px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--p)}label{display:block;color:var(--m);font-size:13px;margin:10px 0 4px}
.btn{border:1px solid var(--b);background:var(--c);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;min-height:40px;transition:filter .15s,transform .1s;white-space:nowrap}.btn:hover{filter:brightness(1.15)}.btn:active{transform:scale(.97)}.pri{background:var(--p);border-color:transparent}.sm{min-height:34px;padding:6px 11px;font-size:13px}.dng{color:var(--bad)}.big{padding:14px 22px;font-size:16px}
.m{color:var(--m)}small{font-size:12px}.lk{color:var(--pl);font-weight:700;padding:6px 0}.price{font-weight:800;font-size:17px;color:var(--pl)}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bet{justify-content:space-between}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:rgba(139,92,246,.18);color:var(--pl);font-size:12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:359px){.grid{grid-template-columns:1fr}}
.gp{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #1c1c24;cursor:pointer}.ic,.sa{width:34px;height:34px;border-radius:10px;background:#2a2140;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}.sa{border-radius:50%;background:var(--p);width:32px;height:32px}
.rw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid #1c1c24;cursor:pointer;animation:fin .25s both}.t{font-weight:700;overflow-wrap:anywhere}.ds{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}.sl{display:flex;align-items:center;gap:8px;min-width:0}.rr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;white-space:nowrap}.fv{font-size:20px;cursor:pointer}
.promo{border-radius:18px;padding:28px 20px;margin:14px 0;background:radial-gradient(120% 140% at 100% 0,rgba(139,92,246,.3),transparent 60%),var(--c);border:1px solid rgba(139,92,246,.22);animation:fin .5s both}.promo h1{font-size:clamp(24px,7vw,34px);max-width:14ch}.promo p{color:var(--m);margin:10px 0 18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tabs a{padding:8px 14px;border-radius:10px;background:var(--c)}.tabs a.on{background:var(--p)}
.lh{font-weight:800;color:var(--pl);margin:16px 0 4px;scroll-margin-top:130px}.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px}.gn{font-weight:700}.gcs{display:flex;flex-wrap:wrap;font-size:13px}.gcs a{color:var(--pl)}.gcs a:not(:last-child)::after{content:"·";color:var(--m);margin:0 5px}.lr{padding:8px 0;border-bottom:1px solid #1c1c24}
.ai{position:fixed;right:2px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;background:rgba(0,0,0,.5);border-radius:10px;padding:4px 0;font-size:11px;z-index:4}.ai a{padding:2px 7px;color:var(--pl)}#gl{padding-right:22px}
.bn{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(11,11,15,.96);backdrop-filter:blur(10px);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom);z-index:6}.bn a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:11px;color:var(--m);position:relative;min-height:54px}.bn a.on{color:var(--p)}.bn svg,.ib svg{width:22px;height:22px;fill:currentColor}
.bd{background:var(--p);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:0 6px;position:absolute;top:2px;right:calc(50% - 22px)}.ib{position:relative;width:40px;height:40px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center}.ib .bd{top:-2px;right:-2px}
.kv{display:flex;gap:22px;flex-wrap:wrap;margin:8px 0}.kv small{display:block;color:var(--m)}.pb{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(11,11,15,.97);border-top:1px solid var(--b);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}.pb .btn{flex:1;min-height:46px}.lay{padding-bottom:90px}
.mm{display:grid;grid-template-columns:minmax(0,1fr)}.mm.ch .ml,.mm:not(.ch) .mc{display:none}.cr{display:flex;gap:10px;align-items:center;min-height:68px;padding:8px 6px;border-bottom:1px solid #16161d;cursor:pointer}.cr.un{background:#211633}.cb{flex:1;min-width:0;display:flex;flex-direction:column}.cb>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc{display:flex;flex-direction:column;height:calc(var(--vh,100dvh) - 150px);min-height:340px}.chm{flex:1;overflow-y:auto;padding:10px 4px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}.lc{flex:none;height:220px;border:1px solid var(--b);border-radius:12px;margin:8px 0;padding:8px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;background:#1a1a22;align-self:flex-start;overflow-wrap:anywhere;animation:fin .2s both}.bub.me{background:var(--p);align-self:flex-end}.bub small{display:block;opacity:.7;margin-top:2px}.dd{align-self:center;color:var(--m);font-size:12px}.cmp{display:flex;gap:8px;padding:8px 0}.chh{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--b)}.bk{font-size:30px;line-height:1;padding:0 8px;cursor:pointer}
.cm header,.cm .bn{display:none}.cm body,body.cm{padding-bottom:0}.cm .mc{height:calc(var(--vh,100dvh) - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.sk{height:64px;border-radius:12px;background:var(--c);margin:10px 0;animation:sk 1.2s infinite}@keyframes sk{50%{opacity:.5}}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--p);padding:10px 18px;border-radius:12px;z-index:9;max-width:90%;animation:fin .2s both}
@media(min-width:781px){body{padding-bottom:0}.hd{flex-wrap:nowrap}.hs{order:0;flex:0 1 280px}.bn,.ai{display:none}#gl{padding-right:0}.lgrid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.mm{grid-template-columns:340px minmax(0,1fr);gap:16px}.mm.ch .ml,.mm:not(.ch) .mc{display:flex}.mm .bk{display:none}.mc{height:calc(100dvh - 170px)}.lay{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding-bottom:30px}.pb{display:none}.dk{display:block!important}}
.dk{display:none}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="w hd" id="hd"></div></header><main class="w" id="app"></main><nav class="bn" id="bn"></nav>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub=c=>(c/100).toLocaleString("ru-RU")+" ₽",go=h=>{location.hash=h};
const ST={pending_payment:"Ожидает оплаты",paid:"Оплачен",in_progress:"В работе",completed:"Завершён",cancelled:"Отменён",dispute:"Открыт спор"},LS={pending:"На модерации",active:"Опубликовано",rejected:"Отклонено",archived:"В архиве"};
const ERR={"auth required":"Войдите в аккаунт","invalid input":"Проверьте введённые данные","email or username taken":"Email или имя уже заняты","wrong email or password":"Неверный email или пароль","become a seller first":"Сначала станьте продавцом","not enough stock":"Недостаточно товара","transition not allowed":"Действие сейчас недоступно"};
let ME=null,GAMES=[],CATS=[],FAV=new Set(),UNREAD=0,CC=null,LID=null,ES=null,F={},PG=0,GQ="";
const SK='<div class="sk"></div><div class="sk"></div><div class="sk"></div>',P={home:"M3 11l9-8 9 8v10h-6v-6H9v6H3z",games:"M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",fav:"M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z",msgs:"M4 4h16v12H8l-4 4z",me:"M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0z"};
const svg=p=>`<svg viewBox="0 0 24 24"><path d="${p}"/></svg>`,sa=n=>`<span class="sa">${esc(String(n)[0]||"?").toUpperCase()}</span>`;
const logo=s=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#c98a4b"/><path d="M4 19c0-8 7-14 16-14s16 6 16 14c0 2-2 3-4 2-1 3-4 3-5 0-1 3-4 3-5 0-1 3-4 3-5 0-1 3-4 3-5 0-2 1-4 0-4-2z" fill="#9333EA"/><circle cx="20" cy="19" r="5" fill="#000"/></svg>`;
const toast=m=>{const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2600)};
async function api(p,o={}){const r=await fetch("/api"+p,{method:o.method||"GET",headers:o.body?{"Content-Type":"application/json"}:{},body:o.body?JSON.stringify(o.body):undefined,credentials:"same-origin"});let d=null;try{d=await r.json()}catch{}if(!r.ok){const e=new Error(ERR[d?.error]||d?.error||"Ошибка "+r.status);e.auth=r.status===401;throw e}return d}
const need=()=>{if(!ME)throw Object.assign(new Error("Войдите в аккаунт"),{auth:1})};
const act=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e.message)}};
function nav(h){const u=ME;$("#hd").innerHTML=`<a class="logo" onclick="go('/')">${logo(26)}DonutPay</a><span class="sp"></span><a class="ib" onclick="go('/m')" aria-label="Сообщения">${svg(P.msgs)}${UNREAD?`<b class="bd">${UNREAD}</b>`:""}</a>${u?`<a class="ib" onclick="go('/me')">${esc(u.username[0].toUpperCase())}</a>`:`<button class="btn sm pri" onclick="go('/login')">Войти</button>`}<input class="hs" placeholder="Поиск игр и товаров" value="${esc(F.q||"")}" onkeydown="if(event.key==='Enter')go('/catalog?q='+encodeURIComponent(this.value))">`;
const k=h==="/"?"home":h.startsWith("/games")?"games":h==="/fav"?"fav":h.startsWith("/m")?"msgs":/^\/(me|login|register|orders|admin|seller)/.test(h)?"me":"";
$("#bn").innerHTML=[["home","/","Главная"],["games","/games","Игры"],["fav","/fav","Избранное"],["msgs","/m","Сообщения"],["me","/me","Профиль"]].map(x=>`<a class="${k===x[0]?"on":""}" onclick="go('${x[1]}')">${svg(P[x[0]])}${x[2]}${x[0]==="msgs"&&UNREAD?`<b class="bd">${UNREAD}</b>`:""}</a>`).join("");document.body.classList.toggle("cm",/^\/m\/./.test(h))}
const empty=t=>`<div class="card m" style="text-align:center">${t}</div>`;
const row=l=>`<div class="rw" onclick="go('/l/${l.id}')"><div style="min-width:0"><div class="m">${esc(l.game_name)} · ${esc(l.category_name)}</div><div class="t">${esc(l.title)}</div><div class="m ds">${esc(l.summary||"")}</div><div class="sl">${sa(l.seller)}<span class="cb"><b style="font-size:13px">${esc(l.seller)}</b><small class="m">${l.rating?"★"+l.rating+" · "+l.reviews+" отз.":"нет отзывов"}${l.delivery_time?" · "+esc(l.delivery_time):""}</small></span></div></div><div class="rr"><span class="fv" onclick="event.stopPropagation();tf('${l.id}',this)">${FAV.has(l.id)?"★":"☆"}</span><span class="m">${l.stock} шт.</span><b class="price">${rub(l.price_cents)}</b><button class="btn sm pri" onclick="event.stopPropagation();buy('${l.id}')">Купить</button></div></div>`;
const rows=(l,t)=>l.length?`<div>${l.map(row).join("")}</div>`:empty(t);
const tf=act(async(id,el)=>{need();if(FAV.has(id)){await api("/favorites/"+id,{method:"DELETE"});FAV.delete(id)}else{await api("/favorites/"+id,{method:"PUT"});FAV.add(id)}el.textContent=FAV.has(id)?"★":"☆"});
const buy=act(async(id)=>{need();const q=+($("#qty")?.value||1);if(!confirm("Оплата не настроена: заказ будет создан со статусом «Ожидает оплаты», деньги не списываются. Продолжить?"))return;await api("/orders",{method:"POST",body:{listingId:id,qty:q}});go("/orders")});
const gp=g=>`<div class="gp" onclick="go('/catalog?game=${g.slug}')"><span class="ic">${esc(g.name.slice(0,2))}</span><b>${esc(g.name)}</b></div>`;
async function home(){const ls=await api("/listings?sort=new");return `<section class="promo"><h1>Всё для твоих любимых игр</h1><p>Находи игровые товары и услуги в одном месте.</p><button class="btn pri big" onclick="go('/catalog')">Перейти к покупкам</button></section><div class="row bet"><h2>Игры</h2><a class="lk" onclick="go('/games')">Все игры</a></div><div class="grid">${GAMES.slice(0,6).map(gp).join("")}</div><h2>Новые предложения</h2>${rows(ls.slice(0,5),"Пока нет опубликованных предложений.")}`}
const CQ=["accounts","currency","items","services"];
function glist(){const q=GQ.toLowerCase(),a=GAMES.filter(g=>g.name.toLowerCase().includes(q)).sort((x,y)=>x.name.localeCompare(y.name,"ru"));if(!a.length)return empty("Игра не найдена. Проверьте запрос.");const L=[...new Set(a.map(g=>g.name[0].toUpperCase()))];
return L.map(l=>`<div class="lh" id="L-${l}">${l}</div><div class="lgrid">${a.filter(g=>g.name[0].toUpperCase()===l).map(g=>`<div class="lr"><a class="gn" onclick="go('/catalog?game=${g.slug}')">${esc(g.name)}</a><div class="gcs">${CATS.filter(c=>CQ.includes(c.slug)).map(c=>`<a onclick="go('/catalog?game=${g.slug}&category=${c.slug}')">${esc(c.name.replace("Игровые ","").replace("Игровая ",""))}</a>`).join("")}</div></div>`).join("")}</div>`).join("")+`<nav class="ai">${L.map(l=>`<a onclick="document.getElementById('L-${l}').scrollIntoView({behavior:'smooth'})">${l}</a>`).join("")}</nav>`}
const games=()=>(GQ="",`<h2>Игры</h2><input placeholder="Поиск по названию" oninput="GQ=this.value;$('#gl').innerHTML=glist()"><div id="gl">${glist()}</div>`);
const sel=(k,arr,all)=>`<select onchange="F.${k}=this.value;go('/catalog?'+new URLSearchParams(F))"><option value="">${all}</option>${arr.map(x=>`<option value="${x.slug}" ${F[k]===x.slug?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`;
const qs=()=>new URLSearchParams(Object.entries(F).filter(e=>e[1])).toString();
async function catalog(){PG=0;const ls=await api("/listings?"+qs());return `<h2>Каталог</h2><div class="grid">${sel("game",GAMES,"Все игры")}${sel("category",CATS,"Все категории")}<input type="number" min="0" placeholder="Цена от" value="${esc(F.min||"")}" onchange="F.min=this.value;go('/catalog?'+qs())"><input type="number" min="0" placeholder="Цена до" value="${esc(F.max||"")}" onchange="F.max=this.value;go('/catalog?'+qs())"></div><div class="row bet" style="margin:10px 0"><select style="width:auto" onchange="F.sort=this.value;go('/catalog?'+qs())">${[["new","Сначала новые"],["cheap","Сначала дешёвые"],["expensive","Сначала дорогие"],["rating","По рейтингу продавца"]].map(o=>`<option value="${o[0]}" ${(F.sort||"new")===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select><button class="btn sm" onclick="F={};go('/catalog')">Сбросить</button></div><div id="rl">${rows(ls,"Ничего не найдено. Измените фильтры или запрос.")}</div>${ls.length===50?'<div style="text-align:center"><button class="btn" onclick="more(this)">Показать ещё</button></div>':""}`}
const more=act(async b=>{PG+=50;const ls=await api("/listings?"+qs()+"&offset="+PG);$("#rl>div").insertAdjacentHTML("beforeend",ls.map(row).join(""));if(ls.length<50)b.remove()});
const bub=m=>`<div class="bub ${m.sender_id===ME.id?"me":""}" id="m${m.id}">${esc(m.body)}<small>${new Date(m.created_at).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</small></div>`;
function bubs(l){let d="";return l.map(m=>{const t=new Date(m.created_at),k=t.toDateString(),h=k!==d?`<div class="dd">${t.toLocaleDateString("ru-RU")}</div>`:"";d=k;return h+bub(m)}).join("")||'<span class="m emp" style="margin:auto">Сообщений пока нет.</span>'}
function addMsg(m){const b=$("#chm");if(!b||$("#m"+m.id))return;b.querySelector(".emp")?.remove();b.insertAdjacentHTML("beforeend",bub(m));b.scrollTop=1e9}
const send=act(async()=>{const v=$("#lt").value.trim();if(!v)return;if(!CC){CC=(await api("/conversations",{method:"POST",body:{listingId:LID}})).id}addMsg(await api(`/conversations/${CC}/messages`,{method:"POST",body:{body:v}}));$("#lt").value=""});
async function listing(id){const l=await api("/listings/"+id),own=ME&&ME.username===l.seller;let rv=[],ms=[];LID=id;
try{rv=await api("/sellers/"+encodeURIComponent(l.seller)+"/reviews")}catch{}
if(ME&&!own){const c=(await api("/conversations")).find(x=>x.listing_id===id);if(c){CC=c.id;ms=await api(`/conversations/${c.id}/messages`);refreshUnread()}}
const chat=own?"":!ME?`<div class="row bet"><span class="m">Войдите, чтобы написать продавцу.</span><button class="btn sm pri" onclick="go('/login')">Войти</button></div>`:`<div class="row bet"><b>Чат с продавцом</b>${CC?`<a class="lk" onclick="go('/m/${CC}')">Открыть весь чат</a>`:""}</div><div class="chm lc" id="chm">${bubs(ms)}</div><div class="cmp"><input id="lt" maxlength="2000" placeholder="Сообщение продавцу" enterkeyhint="send" onkeydown="if(event.key==='Enter')send()"><button class="btn pri" onclick="send()">Отправить</button></div>`;
const buyBox=own?'<p class="m">Это ваше объявление.</p>':`${l.stock>1?`<label>Количество</label><input id="qty" type="number" min="1" max="${l.stock}" value="1" oninput="$('#tot').textContent=rub(${l.price_cents}*Math.max(1,Math.min(${l.stock},+this.value||1)))">`:""}`;
return `<div class="row bet" style="padding:8px 0"><a class="bk" onclick="go('/catalog')" aria-label="К каталогу">‹</a><span class="m" style="flex:1">${esc(l.game_name)} · ${esc(l.category_name)}</span><span class="fv" onclick="tf('${l.id}',this)">${FAV.has(l.id)?"★":"☆"}</span></div><div class="lay"><div><h1 style="font-size:22px;overflow-wrap:anywhere">${esc(l.title)}</h1><div class="kv"><div><small>Наличие</small>${l.stock} шт.</div><div><small>Срок</small>${esc(l.delivery_time||"не указан")}</div></div>${buyBox}<h3>Условия получения</h3><p class="m" style="margin:0">Выдача после подтверждения оплаты. Оплата пока не настроена: деньги не списываются и не удерживаются.</p>${l.summary?`<p>${esc(l.summary)}</p>`:""}${l.details?`<details><summary>Подробнее</summary><p class="m">${esc(l.details)}</p></details>`:""}<div class="row" style="border-top:1px solid var(--b);border-bottom:1px solid var(--b);padding:10px 0;margin-top:14px">${sa(l.seller)}<span class="cb"><b>${esc(l.seller)}</b><small class="m">${l.rating?"★"+l.rating+" · "+l.reviews+" отз.":"нет отзывов"}</small></span><a class="lk" onclick="go('/shop/${encodeURIComponent(l.seller)}')">Профиль</a></div><div style="margin-top:12px">${chat}</div><h3>Отзывы о продавце</h3>${rv.length?rv.slice(0,3).map(r=>`<p style="margin:0 0 6px"><b>★${r.rating}</b> ${esc(r.reviewer)}${r.body?" — "+esc(r.body):""}</p>`).join(""):'<p class="m" style="margin:0">Отзывов пока нет.</p>'}</div><div class="dk card" style="height:fit-content"><div class="price" id="tot">${rub(l.price_cents)}</div>${own?"":`<button class="btn pri" style="width:100%;margin-top:12px" onclick="buy('${l.id}')">Купить</button>`}</div></div>${own?"":`<div class="pb"><b class="price" id="tot2">${rub(l.price_cents)}</b><button class="btn pri" onclick="buy('${l.id}')">Купить</button></div>`}`}
async function shop(u){const ls=await api("/listings?seller="+u),rv=await api("/sellers/"+u+"/reviews");return `<h2>${esc(decodeURIComponent(u))}</h2>${rows(ls,"У продавца нет опубликованных предложений.")}<h2>Отзывы</h2>${rv.map(r=>`<div class="card"><b>★${r.rating}</b> ${esc(r.reviewer)}<div class="m">${esc(r.body||"")}</div></div>`).join("")||empty("Отзывов пока нет.")}`}
async function fav(){need();const ls=await api("/favorites");return `<h2>Избранное</h2>${rows(ls,"Пока ничего не добавлено в избранное.")}`}
const ost=act(async(id,s)=>{await api(`/orders/${id}/status`,{method:"POST",body:{status:s}});route()});
const disp=act(async id=>{const r=prompt("Опишите проблему (минимум 10 символов)");if(!r)return;await api(`/orders/${id}/dispute`,{method:"POST",body:{reason:r}});route()});
const rev=act(async id=>{const r=+prompt("Оценка от 1 до 5");if(!(r>=1&&r<=5))return;await api(`/orders/${id}/review`,{method:"POST",body:{rating:r,body:prompt("Комментарий (необязательно)")||""}});toast("Отзыв сохранён")});
const hist=act(async id=>{const o=await api("/orders/"+id);$("#h"+id).innerHTML=o.events.map(e=>`<div class="m">${ST[e.status]} — ${new Date(e.created_at).toLocaleString("ru-RU")}</div>`).join("")});
async function orders(){need();const os=await api("/orders");return `<h2>Мои заказы</h2>${os.map(o=>{const b=o.buyer_id===ME.id,s=o.status;return `<div class="card"><div class="row bet"><b style="min-width:0;overflow-wrap:anywhere">${esc(o.title)}${o.quantity>1?" ×"+o.quantity:""}</b><span class="tag">${ST[s]}</span></div><div class="m">${b?"Покупка":"Продажа"} · ${rub(o.total_cents)} · Оплата: ${o.payment_status==="not_configured"?"не настроена":esc(o.payment_status)}</div>${s==="pending_payment"?'<p class="m" style="margin:6px 0">Платёжный провайдер не подключён: деньги не списываются и не удерживаются.</p>':""}<div class="row" style="margin-top:8px">${s==="pending_payment"?`<button class="btn sm dng" onclick="ost('${o.id}','cancelled')">Отменить</button>`:""}${s==="paid"&&!b?`<button class="btn sm" onclick="ost('${o.id}','in_progress')">Взять в работу</button>`:""}${s==="in_progress"&&b?`<button class="btn sm pri" onclick="ost('${o.id}','completed')">Подтвердить получение</button>`:""}${["paid","in_progress","completed"].includes(s)?`<button class="btn sm dng" onclick="disp('${o.id}')">Открыть спор</button>`:""}${s==="completed"&&b?`<button class="btn sm" onclick="rev('${o.id}')">Отзыв</button>`:""}<button class="btn sm" onclick="hist('${o.id}')">История</button></div><div id="h${o.id}" style="margin-top:6px"></div></div>`}).join("")||empty("Заказов пока нет.")}`}
const refreshUnread=async()=>{if(!ME)return;try{UNREAD=(await api("/conversations")).reduce((a,c)=>a+c.unread,0);nav(location.hash.slice(1)||"/")}catch{}};
async function msgs(cid){need();const cs=await api("/conversations");let ms=[],cur=null;CC=cid||null;if(cid){cur=cs.find(c=>c.id===cid);if(!cur)throw new Error("Диалог не найден");ms=await api(`/conversations/${cid}/messages`);UNREAD=cs.reduce((a,c)=>a+(c.id===cid?0:c.unread),0)}else UNREAD=cs.reduce((a,c)=>a+c.unread,0);
return `<div class="mm ${cid?"ch":""}"><section class="ml"><h2>Сообщения</h2>${cs.map(c=>`<a class="cr ${c.unread?"un":""}" onclick="go('/m/${c.id}')">${sa(c.other)}<span class="cb"><b>${esc(c.other)}</b><span class="m">${esc(c.last||"Нет сообщений")}</span></span>${c.unread?`<b class="bd" style="position:static">${c.unread}</b>`:""}</a>`).join("")||empty("Диалогов пока нет. Откройте объявление и напишите продавцу.")}</section><section class="mc">${cur?`<div class="chh"><a class="bk" onclick="go('/m')" aria-label="Назад">‹</a>${sa(cur.other)}<b>${esc(cur.other)}</b></div><div class="chm" id="chm">${bubs(ms)}</div><div class="cmp"><input id="lt" maxlength="2000" placeholder="Сообщение" enterkeyhint="send" onkeydown="if(event.key==='Enter')sendC()"><button class="btn pri" onclick="sendC()">Отправить</button></div>`:'<p class="m" style="margin:auto">Выберите диалог</p>'}</section></div>`}
const sendC=act(async()=>{const v=$("#lt").value.trim();if(!v)return;addMsg(await api(`/conversations/${CC}/messages`,{method:"POST",body:{body:v}}));$("#lt").value="";$("#lt").focus()});
function auth(mode){const r=mode==="register";return `<div class="card" style="max-width:420px;margin:30px auto"><h2 style="margin-top:0">${r?"Регистрация":"Вход"}</h2><label>Email</label><input id="em" type="email" autocomplete="email">${r?'<label>Имя пользователя (3–24 символа)</label><input id="un" autocomplete="username">':""}<label>Пароль${r?" (минимум 8 символов)":""}</label><input id="pw" type="password" autocomplete="${r?"new-password":"current-password"}" onkeydown="if(event.key==='Enter')doAuth('${mode}')"><button class="btn pri" style="width:100%;margin-top:14px" onclick="doAuth('${mode}')">${r?"Создать аккаунт":"Войти"}</button><p class="m"><a class="lk" onclick="go('/${r?"login":"register"}')">${r?"Уже есть аккаунт? Войти":"Нет аккаунта? Регистрация"}</a></p></div>`}
const doAuth=act(async m=>{ME=await api("/auth/"+m,{method:"POST",body:{email:$("#em").value,username:$("#un")?.value,password:$("#pw").value}});await afterLogin();go("/me")});
async function afterLogin(){try{(await api("/favorites")).forEach(l=>FAV.add(l.id))}catch{}refreshUnread();if(!ES){ES=new EventSource("/api/stream");ES.addEventListener("message",e=>{const m=JSON.parse(e.data);if(m.conversation_id===CC){addMsg(m);if(m.sender_id!==ME.id)api(`/conversations/${CC}/messages`).catch(()=>{})}else if(m.sender_id!==ME.id){UNREAD++;nav(location.hash.slice(1)||"/");toast("Новое сообщение")}})}}
async function me(){if(!ME)return auth("login");const ml=ME.is_seller?await api("/my/listings"):[];
return `<h2>Профиль</h2><div class="card"><label>Имя пользователя</label><input id="pn" value="${esc(ME.username)}" maxlength="24"><label>О себе</label><textarea id="pb" rows="2" maxlength="300">${esc(ME.bio||"")}</textarea><div class="row" style="margin-top:12px"><button class="btn pri" onclick="saveMe({username:$('#pn').value,bio:$('#pb').value})">Сохранить</button>${ME.is_seller?"":'<button class="btn" onclick="saveMe({is_seller:true})">Стать продавцом</button>'}<button class="btn dng" onclick="logout()">Выйти</button></div><p class="m">Email: ${esc(ME.email)} · Рейтинг считается из отзывов покупателей.</p></div><div class="row"><a class="btn sm" onclick="go('/orders')">Мои заказы</a>${ME.role==="admin"?'<a class="btn sm" onclick="go(\'/admin\')">Админ-панель</a>':""}</div>${ME.is_seller?sellerForm(ml):""}`}
const sellerForm=ml=>`<h2>Новое объявление</h2><div class="card"><div class="grid"><div><label>Игра</label><select id="lg">${GAMES.map(g=>`<option value="${g.slug}">${esc(g.name)}</option>`).join("")}</select></div><div><label>Категория</label><select id="lc2">${CATS.map(c=>`<option value="${c.slug}">${esc(c.name)}</option>`).join("")}</select></div></div><label>Название (5–120 символов)</label><input id="lt2" maxlength="120"><div class="grid"><div><label>Цена, ₽</label><input id="lp" type="number" min="1"></div><div><label>Количество</label><input id="ls" type="number" min="1" value="1"></div></div><label>Срок выполнения</label><input id="ld" maxlength="40" placeholder="например, 15 минут"><label>Кратко</label><input id="lsm" maxlength="300"><label>Подробнее</label><textarea id="ldt" rows="3" maxlength="3000"></textarea><button class="btn pri" style="margin-top:12px" onclick="createL()">Отправить на модерацию</button></div><h2>Мои объявления</h2>${ml.map(l=>`<div class="card row bet"><span style="min-width:0;overflow-wrap:anywhere">${esc(l.title)} · ${rub(l.price_cents)} <span class="tag">${LS[l.status]}</span></span><button class="btn sm dng" onclick="delL('${l.id}')">В архив</button></div>`).join("")||empty("Пока нет объявлений.")}`;
const createL=act(async()=>{await api("/listings",{method:"POST",body:{game:$("#lg").value,category:$("#lc2").value,title:$("#lt2").value,price:$("#lp").value,stock:$("#ls").value,delivery_time:$("#ld").value,summary:$("#lsm").value,details:$("#ldt").value}});toast("Отправлено на модерацию");route()});
const delL=act(async id=>{if(confirm("Убрать объявление в архив?")){await api("/listings/"+id,{method:"DELETE"});route()}});
const saveMe=act(async b=>{ME=await api("/me",{method:"PATCH",body:b});toast("Сохранено");route()});
const logout=act(async()=>{await api("/auth/logout",{method:"POST"});ME=null;FAV.clear();UNREAD=0;ES?.close();ES=null;go("/")});
const modL=act(async(id,s)=>{await api(`/admin/listings/${id}/status`,{method:"POST",body:{status:s}});route()}),resD=act(async(id,s)=>{await api(`/admin/disputes/${id}/resolve`,{method:"POST",body:{status:s,resolution:prompt("Решение (кратко)")||""}});route()});
async function admin(){need();if(ME.role!=="admin")return empty("Доступ только для администраторов.");const[ls,ds]=await Promise.all([api("/admin/listings"),api("/admin/disputes")]);
return `<h2>Модерация объявлений</h2>${ls.map(l=>`<div class="card"><b>${esc(l.title)}</b><div class="m">${esc(l.seller)} · ${rub(l.price_cents)}</div><div class="row" style="margin-top:8px"><button class="btn sm pri" onclick="modL('${l.id}','active')">Одобрить</button><button class="btn sm dng" onclick="modL('${l.id}','rejected')">Отклонить</button></div></div>`).join("")||empty("Очередь пуста.")}<h2>Споры</h2>${ds.map(d=>`<div class="card"><div class="row bet"><b>Заказ ${esc(d.order_id.slice(0,8))}</b><span class="tag">${esc(d.status)}</span></div><p>${esc(d.reason)}</p>${d.status==="open"?`<div class="row"><button class="btn sm" onclick="resD('${d.id}','resolved_buyer')">В пользу покупателя</button><button class="btn sm" onclick="resD('${d.id}','resolved_seller')">В пользу продавца</button><button class="btn sm" onclick="resD('${d.id}','closed')">Закрыть</button></div>`:""}</div>`).join("")||empty("Споров нет.")}`}
const text={how:()=>"",support:()=>`<h2>Поддержка</h2>${empty("Форма обращения подключается позже. Пока откройте спор в заказе или отправьте жалобу.")}`};
async function route(){const raw=location.hash.slice(1)||"/",[path,q]=raw.split("?"),seg=path.split("/").filter(Boolean),a=seg[0]||"",b=seg.slice(1).join("/");CC=null;
if(a==="catalog"){F=Object.fromEntries(new URLSearchParams(q||""))}else if(a==="")F={};
nav(path);$("#app").innerHTML=SK;
try{const f={"":home,games,catalog,l:listing,shop,fav,orders,m:msgs,me,admin,login:()=>auth("login"),register:()=>auth("register"),support:text.support}[a]||home;$("#app").innerHTML=await f(b);const c=$("#chm");if(c)c.scrollTop=1e9;if(!/^\/(catalog|games)/.test(path)||true)window.scrollTo(0,0)}
catch(e){$("#app").innerHTML=`<div class="card" style="margin-top:20px"><b>${esc(e.message)}</b><div class="row" style="margin-top:10px">${e.auth?'<button class="btn pri" onclick="go(\'/login\')">Войти</button>':'<button class="btn" onclick="route()">Повторить</button>'}</div></div>`}}
if(window.visualViewport){const sv=()=>document.documentElement.style.setProperty("--vh",visualViewport.height+"px");visualViewport.addEventListener("resize",sv);sv()}
window.addEventListener("hashchange",route);
(async()=>{$("#app").innerHTML=SK;try{[GAMES,CATS]=await Promise.all([api("/games"),api("/categories")]);try{ME=await api("/me");await afterLogin()}catch{}}catch(e){$("#app").innerHTML=`<div class="card">Не удалось связаться с сервером: ${esc(e.message)}</div>`;return}route()})();
</script></body></html>
